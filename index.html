<!DOCTYPE html>
<html lang="it">
<head>
   <meta charset="UTF-8">
   <title>Gumpress – WordPress Local Environment</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="GumPress is a free, portable WordPress local development environment for Windows. No setup, no admin rights, ready to use.">

   <meta property="og:type" content="website">
   <meta property="og:url" content="https://gumpress.github.io/">
   <meta property="og:title" content="GumPress – WordPress Local Environment">
   <meta property="og:description" content="Free, portable WordPress local development environment for Windows. No setup, no admin rights, ready to use.">
   <meta property="og:image" content="https://gumpress.github.io/images/logo.png">

   <meta name="twitter:card" content="summary_large_image">
   <meta name="twitter:title" content="GumPress – WordPress Local Environment">
   <meta name="twitter:description" content="Free, portable WordPress local development environment for Windows. No setup, no admin rights, ready to use.">
   <meta name="twitter:image" content="https://gumpress.github.io/images/logo.png">

   <style>
      :root {
         --bg: #0f1115;
         --card: #151821;
         --text: #e6e6e6;
         --muted: #9aa0b2;
         --orange: #ff7a00;
      }

      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
         min-height: 100vh;
         background: radial-gradient(ellipse at center, #1b1f2b 0%, var(--bg) 70%);
         display: flex;
         align-items: center;
         justify-content: center;
         color: var(--text);
         padding: 20px;
      }

      /* Layout principale a due colonne */
      .layout-container {
         display: flex;
         width: 100%;
         max-width: 1200px;
         gap: 40px;
         align-items: center;
         justify-content: center;
      }

      /* Colonna sinistra (Occupa 1/4 dello spazio totale) */
      .sidebar-content {
         flex: 0 0 25%;
         display: flex;
         flex-direction: column;
         align-items: center; /* Centra i blocchi orizzontalmente nel quarto */
         text-align: center; /* Centra i testi all'interno del paragrafo */
      }

      /* Colonna destra (Occupa 3/4 dello spazio totale) */
      .video-container {
         flex: 0 0 75%;
         background: rgba(255, 255, 255, 0.03);
         border: 1px solid rgba(255, 255, 255, 0.1);
         border-radius: 12px;
         overflow: hidden;
         box-shadow: 0 20px 40px rgba(0,0,0,0.5);
         /* Mantiene le proporzioni 16:9 adattate ai 3/4 di larghezza */
         position: relative;
         width: 100%;
         padding-top: 42.1875%;
      }

         .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Evita bande nere se le proporzioni del file differiscono leggermente */
            border: 0;
         }

      .logo {
         max-width: 200px;
         width: 100%;
         margin-bottom: 20px;
      }

      h1 {
         font-size: 2.2rem;
         font-weight: 600;
         margin-bottom: 12px;
         letter-spacing: -0.02em;
      }

         h1 span {
            color: var(--orange);
         }

      p {
         font-size: 1rem;
         color: var(--muted);
         line-height: 1.6;
         margin-bottom: 20px;
         max-width: 280px; /* Testo compatto e armonioso */
      }

      .badge {
         display: inline-block;
         padding: 6px 14px;
         font-size: 0.75rem;
         letter-spacing: 1px;
         text-transform: uppercase;
         border-radius: 999px;
         background: rgba(255, 122, 0, 0.15);
         color: var(--orange);
         margin-bottom: 24px;
      }

      .github-link {
         display: inline-flex;
         align-items: center;
         gap: 8px;
         padding: 10px 20px;
         font-size: 0.9rem;
         font-weight: 500;
         color: var(--text);
         background: rgba(255,255,255,0.07);
         border: 1px solid rgba(255,255,255,0.1);
         border-radius: 8px;
         text-decoration: none;
         transition: background 0.2s, border-color 0.2s;
      }

         .github-link:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
         }

         .github-link svg {
            flex-shrink: 0;
         }

      /* Ottimizzazione Responsive per Mobile */
      @media (max-width: 768px) {
         .layout-container {
            flex-direction: column;
            gap: 30px;
         }

         .sidebar-content, .video-container {
            flex: 0 0 100%;
         }

         p {
            max-width: 420px;
         }

         .video-container {
            padding-top: 56.25%; /* Ritorna al classico 16:9 su smartphone */
         }
      }
   </style>
</head>
<body>

   <div class="layout-container">

      <div class="sidebar-content">
         <img src="images/logo.png" alt="Gumpress logo" class="logo">

         <p>
            GumPress is a new WordPress environment designed to simplify workflows
            for users and developers.
         </p>

         <div class="badge">
            WordPress Environment
         </div>

         <a class="github-link" href="https://github.com/gumpress" target="_blank" rel="noopener">

            View on GitHub
         </a>
      </div>

      <div class="video-container">

         <video autoplay muted loop playsinline controls>
            <source src="videos/video01.mp4" type="video/mp4">
            Il tuo browser non supporta i video.
         </video>

      </div>

   </div>

</body>
</html>
