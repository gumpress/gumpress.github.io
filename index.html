<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gumpress – Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #0f1115;
            --card: #151821;
            --text: #e6e6e6;
            --muted: #9aa0b2;
            --orange: #ff7a00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at center, #1b1f2b 0%, var(--bg) 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .wrapper {
            text-align: center;
            padding: 40px 30px;
        }

        .logo {
            max-width: 260px;
            width: 70%;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--orange);
        }

        p {
            font-size: 1rem;
            color: var(--muted);
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .badge {
            display: inline-block;
            margin-top: 22px;
            padding: 6px 14px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 999px;
            background: rgba(255, 122, 0, 0.15);
            color: var(--orange);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="images/logo.png" alt="Gumpress logo" class="logo">
        <p>
            GumPress is a new WordPress environment designed to simplify workflows
            for users and developers.
        </p>

        <div class="badge">
            WordPress Environment
        </div>
    </div>

</body>
</html>
